<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — TripleC</title>
<!-- Styles are inline on purpose: this page is served before authentication,
     so it must not depend on /style.css, which requires a session. -->
<style>
  :root {
    --bg: #141413; --bg-raised: #1e1e1c; --bg-input: #272725;
    --border: #34342f; --text: #f5f4ef; --text-dim: #a3a099;
    --accent: #d97757; --error: #e05252; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--text-dim); font-size: 14px; }
  form { display: grid; gap: 12px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 14px 16px; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: var(--radius); cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: default; }
  .msg { min-height: 20px; font-size: 14px; color: var(--error); }
  .note {
    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--text-dim);
  }
</style>
</head>
<body>
<main>
  <h1>TripleC</h1>
  <p class="sub">This workspace runs commands on a real machine. Sign in to continue.</p>

  <form id="form" autocomplete="on">
    <!-- A username field, hidden but present, so password managers will offer
         to save the credential. Without one, iOS and Chrome often refuse. -->
    <input type="text" name="username" value="workspace" autocomplete="username"
           hidden aria-hidden="true" tabindex="-1">
    <input id="password" type="password" name="password" placeholder="Password"
           autocomplete="current-password" required autofocus
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <button id="submit" type="submit">Sign in</button>
  </form>

  <p class="msg" id="msg" role="alert" aria-live="polite"></p>

  <p class="note" id="note" hidden></p>
</main>

<script>
(function () {
  var form = document.getElementById('form');
  var password = document.getElementById('password');
  var submit = document.getElementById('submit');
  var msg = document.getElementById('msg');

  // If this deployment authenticates at the load balancer, a local password
  // form is meaningless — say so rather than showing a box that always fails.
  fetch('/api/auth-mode')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.mode === 'oidc') {
        form.hidden = true;
        var note = document.getElementById('note');
        note.hidden = false;
        note.textContent =
          'This deployment signs in through its identity provider. If you are ' +
          'seeing this page, the provider did not return a valid token — reload ' +
          'to start the sign-in flow again.';
      }
    })
    .catch(function () { /* the form is the sensible default */ });

  /**
   * Where to land after a successful login. Only same-origin relative paths are
   * honoured: echoing an arbitrary ?next= back into a redirect would turn this
   * page into an open redirect, which is exactly the primitive a phishing link
   * wants from a login screen.
   */
  function safeNext() {
    var raw = new URLSearchParams(location.search).get('next') || '/';
    if (raw.charAt(0) !== '/' || raw.charAt(1) === '/' || raw.charAt(1) === '\\') return '/';
    return raw;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    msg.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Signing in…';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password.value }),
    })
      .then(function (res) {
        if (res.status === 204) {
          location.replace(safeNext());
          return null;
        }
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (res.status === 429) {
            msg.textContent =
              'Too many attempts. Try again in ' + (data.retryAfter || 60) + 's.';
          } else {
            msg.textContent = data.error || 'Sign in failed.';
          }
          password.value = '';
          password.focus();
          submit.disabled = false;
          submit.textContent = 'Sign in';
          return null;
        });
      })
      .catch(function () {
        msg.textContent = 'Could not reach the server.';
        submit.disabled = false;
        submit.textContent = 'Sign in';
      });
  });
})();
</script>
</body>
</html>
