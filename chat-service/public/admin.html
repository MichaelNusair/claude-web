<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TripleC · box</title>
<!-- No manifest link: this is a page you open when something is wrong, not a
     second installable app competing with the chat for the home screen. -->
<link rel="stylesheet" href="/chat/style.css">
</head>
<body>

<section class="screen active">
  <header class="bar">
    <!-- /chat/, not /: that is where the chat app lives and what its manifest
         scopes, so this link stays inside the installed window instead of
         bouncing out to the redirect and back. -->
    <a class="icon-btn back" href="/chat/" aria-label="Back to chats">
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
    </a>
    <div class="bar-title">
      <span id="admin-title">This box</span>
      <span id="admin-sub" class="sub">loading…</span>
    </div>
    <button id="btn-refresh" class="icon-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M17.6 6.4A8 8 0 1 0 19.7 13h-2.1a6 6 0 1 1-1.5-5.1L13 11h7V4z"/></svg>
    </button>
  </header>

  <div class="list-body">
    <!-- Findings first, and only when there are any. Everything below is an
         inventory; this is the part that says whether it matters. -->
    <div id="findings"></div>

    <div class="section-label">Host</div>
    <div id="host" class="cards"></div>

    <div class="section-label">Services</div>
    <div id="units" class="units"></div>

    <!-- The stop-all buttons live in the labels, as far from the per-row Stop as
         the section is tall. They are hidden until there are two things to stop,
         and admin.js writes the count into them. -->
    <div class="section-label with-action">Chat conversations
      <button id="stop-all-chat" class="label-btn hidden">Stop all</button></div>
    <div id="surface-chat"></div>

    <div class="section-label with-action">Editor panel <span class="label-note">via the broker</span>
      <button id="stop-all-broker" class="label-btn hidden">Stop all</button></div>
    <div id="surface-broker"></div>

    <div class="section-label with-action">Terminal <span class="label-note">tmux, <code>cc</code></span>
      <button id="stop-all-tmux" class="label-btn hidden">End all</button></div>
    <div id="surface-tmux"></div>

    <p class="hint" id="admin-footer"></p>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="/chat/admin.js"></script>
</body>
</html>
